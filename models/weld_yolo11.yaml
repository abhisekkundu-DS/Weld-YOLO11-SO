# Weld-YOLO11-SO Model Architecture Definition
# Specialized for Small Welding Defect Detection
# Input size: 1024x1024
# Classes (nc=3): 0: Bad Weld, 1: Good Weld, 2: Defect

nc: 3

names:
  0: Bad Weld
  1: Good Weld
  2: Defect

scales:
  # Model compound scaling constants [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # Nano scale (lightweight real-time industrial inference)
  s: [0.50, 0.50, 1024] # Small scale
  m: [0.50, 1.00, 512]  # Medium scale
  l: [1.00, 1.00, 512]  # Large scale
  x: [1.00, 1.50, 512]  # Extra large scale

# 1. YOLO11-style Backbone with P2 high-resolution branch
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2 (stride 2, 512x512)
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4 (stride 4, 256x256)
  - [-1, 2, C3k2, [128, False, 0.25]]  # 2-P2/4 feature map (stride 4, 256x256, 128 ch) - Small defect spatial branch
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8 (stride 8, 128x128)
  - [-1, 2, C3k2, [256, False, 0.25]]  # 4-P3/8 feature map (stride 8, 128x128, 256 ch)
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16 (stride 16, 64x64)
  - [-1, 2, C3k2, [512, True]]          # 6-P4/16 feature map (stride 16, 64x64, 512 ch)
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32 (stride 32, 32x32)
  - [-1, 2, C3k2, [1024, True]]         # 8-P5/32 processing (stride 32, 32x32)
  - [-1, 1, SPPF, [1024, 5]]           # 9-SPPF feature extraction (stride 32, 32x32)
  - [-1, 2, C2PSA, [1024]]              # 10-C2PSA feature map (stride 32, 32x32, 1024 ch)

# 2. Weld-YOLO11 Neck with Wavelet Enhancement (WID-YOLO11), AHSFPN, WeldSimAM & DySample
head:
  # --- 3. Frequency / Wavelet Feature Block (WID-YOLO11) on P2, P3, P4, P5 ---
  - [2, 1, WaveletBlock, [128]]        # 11-Wavelet enhanced P2 feature map (256x256, 128 ch)
  - [4, 1, WaveletBlock, [256]]        # 12-Wavelet enhanced P3 feature map (128x128, 256 ch)
  - [6, 1, WaveletBlock, [512]]        # 13-Wavelet enhanced P4 feature map (64x64, 512 ch)
  - [10, 1, WaveletBlock, [1024]]      # 14-Wavelet enhanced P5 feature map (32x32, 1024 ch)

  # --- 4. AHSFPN Top-Down Feature Aggregation with DySample Upsampling ---
  - [14, 1, DySample, [512, 2]]        # 15-DySample dynamic upsample P5 (32x32 -> 64x64, 512 ch)
  - [[-1, 13], 1, Concat, [1]]         # 16-Concat upsampled P5 + Wavelet P4 (64x64, 1024 ch)
  - [-1, 2, C3k2, [512, False]]        # 17-Top-down P4 feature map (64x64, 512 ch, stride 16)

  - [17, 1, DySample, [256, 2]]        # 18-DySample dynamic upsample P4 (64x64 -> 128x128, 256 ch)
  - [[-1, 12], 1, Concat, [1]]         # 19-Concat upsampled P4 + Wavelet P3 (128x128, 512 ch)
  - [-1, 2, C3k2, [256, False]]        # 20-Top-down P3 feature map (128x128, 256 ch, stride 8)

  - [20, 1, DySample, [128, 2]]        # 21-DySample dynamic upsample P3 (128x128 -> 256x256, 128 ch)
  - [[-1, 11], 1, Concat, [1]]         # 22-Concat upsampled P3 + Wavelet P2 (256x256, 256 ch)
  - [-1, 2, C3k2, [128, False]]        # 23-Top-down P2 feature map (256x256, 128 ch, stride 4)

  # --- 5. AHSFPN Bottom-Up Feature Aggregation with WeldSimAM Directional Attention ---
  - [23, 1, WeldSimAM, [128]]          # 24-P2 Detection scale feature output (stride 4, 256x256, 128 ch)

  - [24, 1, Conv, [128, 3, 2]]         # 25-Downsample P2 (256x256 -> 128x128, 128 ch)
  - [[-1, 20], 1, Concat, [1]]         # 26-Concat downsampled P2 + top-down P3 (128x128, 384 ch)
  - [-1, 2, C3k2, [256, False]]        # 27-Bottom-up P3 fused feature map (128x128, 256 ch)
  - [27, 1, WeldSimAM, [256]]          # 28-P3 Detection scale feature output (stride 8, 128x128, 256 ch)

  - [28, 1, Conv, [256, 3, 2]]         # 29-Downsample P3 (128x128 -> 64x64, 256 ch)
  - [[-1, 17], 1, Concat, [1]]         # 30-Concat downsampled P3 + top-down P4 (64x64, 768 ch)
  - [-1, 2, C3k2, [512, False]]        # 31-Bottom-up P4 fused feature map (64x64, 512 ch)
  - [31, 1, WeldSimAM, [512]]          # 32-P4 Detection scale feature output (stride 16, 64x64, 512 ch)

  - [32, 1, Conv, [512, 3, 2]]         # 33-Downsample P4 (64x64 -> 32x32, 512 ch)
  - [[-1, 14], 1, Concat, [1]]         # 34-Concat downsampled P4 + Wavelet P5 (32x32, 1536 ch)
  - [-1, 2, C3k2, [1024, True]]        # 35-Bottom-up P5 fused feature map (32x32, 1024 ch)
  - [35, 1, WeldSimAM, [1024]]         # 36-P5 Detection scale feature output (stride 32, 32x32, 1024 ch)

  # --- 6. Multi-Scale Detect Head (4 detection scales: P2, P3, P4, P5) ---
  - [[24, 28, 32, 36], 1, Detect, [nc]] # Detect head taking 4 feature scale maps [P2, P3, P4, P5]
